[project]
name = "brightcon-2026-jacobi-gmres"
version = "0.1.0"
description = "Notebook demo of Jacobi-preconditioned GMRES for large Brightway systems"
requires-python = ">=3.11"
dependencies = [
  "bw2calc>=2.4.0,<3",
  "bw2io>=0.9,<1",
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "psutil>=6,<8",
  "scikit-umfpack>=0.3.3,<0.4",
  "scipy>=1.13,<2",
]

[tool.uv]
package = false
